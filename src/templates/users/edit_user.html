{% extends 'base.html' %}

{% block title %}Editar Usuario{% endblock %}

{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/usuarios.css') }}">
{% endblock %}

{% block body %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Editar Usuario</h2>
        <a href="{{ url_for('user.list_users') }}" class="btn btn-outline-secondary btn-sm">Volver a la lista</a>
    </div>

    <div class="card usuario-card">
        <div class="card-header bg-white">
            <strong>Datos del Usuario</strong>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('user.edit_user', user_id=user.id) }}">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="namee" class="form-label">Nombre</label>
                        <div class="input-group">
                            <span class="input-group-text">&#128100;</span>
                            <input type="text" class="form-control" id="namee" name="namee" value="{{ user.namee }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text">&#9993;</span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="password" class="form-label">Nueva Contraseña <small class="text-muted">(dejar vacío para no cambiar)</small></label>
                        <div class="input-group">
                            <span class="input-group-text">&#128274;</span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text">&#128274;</span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repetir contraseña" minlength="6">
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="role" class="form-label">Rol</label>
                        <div class="input-group">
                            <span class="input-group-text">&#9881;</span>
                            <select class="form-select" id="role" name="role">
                                <option value="cotizador" {% if user.role == 'cotizador' %}selected{% endif %}>Cotizador</option>
                                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
